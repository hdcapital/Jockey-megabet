# Live diagnostic: run the live integration test + endpoint probe + one scan
# against the real Sportsbet service, and surface the real responses in the
# job log / artifacts so parser issues can be fixed against actual data.
#
# Verified findings (runs 32543539735 / 32543634489, 2026-08-22) from
# GitHub-hosted runners (US Azure IPs):
#   * Sportsbet: Akamai edge answers 403 "Access Denied" on every endpoint —
#     Sportsbet serves Australian IPs only.
#   * Betfair: identity SSO answers 403 (Betfair block page) and the betting
#     JSON-RPC endpoint answers 403 via a Cloudflare "Attention Required"
#     challenge — Betfair's edge blocks these datacenter IPs too.
# Both are the providers' own access controls; this project does not bypass
# them. This workflow can only retrieve live data on a SELF-HOSTED runner in
# Australia (change `runs-on` to [self-hosted]) or an equivalent AU host.

name: live-test

on:
  workflow_dispatch: {}
  # workflow_dispatch only registers from the default branch, so during
  # development the live test also runs on every push to the dev branch.
  push:
    branches:
      - claude/sportsbet-jockey-megabet-scanner-xbnjzv

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests (no network)
        run: python -m pytest -q
      - name: Probe real endpoints (prints actual response structure)
        run: python scripts/probe_endpoints.py
      - name: Live integration test
        continue-on-error: true
        run: python -m pytest -m live -rs -v
      - name: One real scan
        continue-on-error: true
        run: python -m app.scan -v --show-low
      - name: Upload raw responses + observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-${{ github.run_id }}
          path: |
            data/raw/
            data/*.db
          if-no-files-found: ignore
