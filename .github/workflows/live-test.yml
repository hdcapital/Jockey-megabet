# Live diagnostic: run the live integration test + endpoint probe + one scan
# against the real Sportsbet service, and surface the real responses in the
# job log / artifacts so parser issues can be fixed against actual data.
#
# Verified finding (run 32543539735, 2026-08-22): from GitHub-hosted runners
# (US Azure IPs) Sportsbet's Akamai edge responds 403 Forbidden — Sportsbet
# geo-restricts to Australian IPs. The Sportsbet legs of this workflow can
# only succeed on a self-hosted runner in Australia (change `runs-on`).
# The Betfair reachability probe works from hosted runners.

name: live-test

on:
  workflow_dispatch: {}
  # workflow_dispatch only registers from the default branch, so during
  # development the live test also runs on every push to the dev branch.
  push:
    branches:
      - claude/sportsbet-jockey-megabet-scanner-xbnjzv

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests (no network)
        run: python -m pytest -q
      - name: Probe real endpoints (prints actual response structure)
        run: python scripts/probe_endpoints.py
      - name: Live integration test
        continue-on-error: true
        run: python -m pytest -m live -rs -v
      - name: One real scan
        continue-on-error: true
        run: python -m app.scan -v --show-low
      - name: Upload raw responses + observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-${{ github.run_id }}
          path: |
            data/raw/
            data/*.db
          if-no-files-found: ignore
